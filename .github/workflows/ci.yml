name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version-sync:
    # Fail fast if the package version drifts across csproj, README, and CHANGELOG.
    # A crypto package leaking inconsistent version strings is a trust signal we
    # never want to send.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check version is in sync across csproj/README/CHANGELOG
        run: bash scripts/check-version-sync.sh

  format:
    # Enforce the .editorconfig code style. Keeps diffs about behavior, not
    # whitespace.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
          global-json-file: global.json
      - name: Verify formatting
        run: dotnet format --verify-no-changes --severity warn

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET (8 + 9 + 10)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build (Release, warnings as errors)
        run: dotnet build -c Release --no-restore

      # The native ML-KEM / ML-DSA primitives (used by the net10 token tests)
      # require OpenSSL 3.5+. Stock GitHub runners may ship an older OpenSSL on
      # Linux, in which case those tests SKIP THEMSELVES (with a reason) rather
      # than fail. The Linux lane here is "portability + non-PQ paths";
      # cryptographic assurance lives in the Windows lane and the
      # linux-pq-required job (separate, PQ-pinned).
      - name: Report OpenSSL version
        if: runner.os == 'Linux'
        run: openssl version

      - name: Test (Release, with coverage)
        shell: bash
        run: |
          set -o pipefail
          dotnet test -c Release --no-build --logger "console;verbosity=minimal" \
            --collect "XPlat Code Coverage" | tee test-output.log

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: "**/coverage.cobertura.xml"
          if-no-files-found: warn
          retention-days: 7

      # On Windows the runner has the native ML-KEM / ML-DSA primitives, so every
      # post-quantum test MUST run. If anything skipped, we are no longer proving
      # the cryptographic paths in CI — fail the job.
      # The skip-count parsing lives in one script (scripts/count-skipped-tests.sh)
      # so a `dotnet test` console-format change breaks visibly in one place —
      # the script errors when no summary lines exist rather than reporting 0.
      - name: Require zero skipped tests on Windows (PQ paths must run)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          skipped=$(bash scripts/count-skipped-tests.sh test-output.log)
          echo "Total skipped across TFMs: $skipped"
          if [[ "$skipped" -ne 0 ]]; then
            echo "::error::Windows is the PQ-required lane; $skipped test(s) skipped (ML-KEM/ML-DSA unavailable?)."
            exit 1
          fi
          echo "PQ-required check passed: 0 skipped tests on Windows."

  linux-pq-required:
    # Linux PQ-pinned lane: installs OpenSSL 3.5+ via conda-forge and runs the
    # net10 suite with LD_LIBRARY_PATH pointed at it, then asserts zero skips.
    # Stands alongside the Windows lane as cross-platform proof that the
    # ML-KEM / ML-DSA / X-Wing token paths actually executed in CI.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up miniconda + OpenSSL 3.5
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: false
          activate-environment: pq
          channels: conda-forge

      - name: Install OpenSSL 3.5+ (3.x series) from conda-forge
        run: |
          # Pin to the 3.x line: conda-forge resolves an unbounded ">=3.5" to
          # OpenSSL 4.x now, and the .NET 10 BCL PQC path binds libcrypto.so.3 —
          # against 4.0.1 MLDsa.IsSupported is false and all PQ tests skip
          # (which this lane's zero-skip gate correctly turned into a failure).
          conda install -y -n pq -c conda-forge "openssl>=3.5,<4"
          "$CONDA/envs/pq/bin/openssl" version
          echo "PQ_OPENSSL_LIB=$CONDA/envs/pq/lib" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Test net10 (Release) with PQ-capable OpenSSL on LD_LIBRARY_PATH
        run: |
          set -o pipefail
          LD_LIBRARY_PATH="$PQ_OPENSSL_LIB${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            dotnet test tests/PostQuantum.Identity.Tests/PostQuantum.Identity.Tests.csproj \
            -c Release -f net10.0 --no-build --logger "console;verbosity=minimal" \
            | tee test-output.log

      - name: Require zero skipped tests on Linux (PQ paths must run)
        run: |
          set -euo pipefail
          skipped=$(bash scripts/count-skipped-tests.sh test-output.log)
          echo "Skipped on net10 PQ lane: $skipped"
          if [[ "$skipped" -ne 0 ]]; then
            echo "::error::Linux PQ-required lane: $skipped test(s) skipped — OpenSSL 3.5+ should make ML-KEM/ML-DSA available."
            exit 1
          fi
          echo "PQ-required check passed on Linux: 0 skipped tests."

  macos-discovery:
    # Discovery, not enforcement — and deliberately NOT per-PR: macOS runners
    # are the scarcest and most expensive, and the only unique signal here
    # ("has the BCL macOS ML-DSA path lit up on the runner image?") changes
    # per runner-image release, not per commit. Runs on pushes to main.
    # Argon2id assurance lives in the Linux/Windows lanes; the PQ-required
    # zero-skip gates are Windows and linux-pq-required.
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore and build (Release)
        run: dotnet build -c Release

      - name: Test net10 (Release)
        run: |
          set -o pipefail
          dotnet test tests/PostQuantum.Identity.Tests/PostQuantum.Identity.Tests.csproj \
            -c Release -f net10.0 --no-build --logger "console;verbosity=minimal" \
            | tee test-output.log

      - name: Report PQ test availability on macOS (informational)
        run: |
          set -euo pipefail
          skipped=$(bash scripts/count-skipped-tests.sh test-output.log)
          if [[ "$skipped" -ne 0 ]]; then
            echo "::notice::macOS: $skipped PQ test(s) skipped — ML-DSA not available on this runner image yet. Argon2id suite ran fully."
          else
            echo "::notice::macOS: 0 skips — the full PQ token suite ran. Consider promoting macOS to a PQ-required lane and updating the README compatibility table."
          fi

  benchmarks:
    # Argon2id benchmarks, tracked over time with a regression budget — the
    # Roadmap-to-1.0 "benchmarks in CI" gate. Runs on pushes to main only:
    # shared runners are too noisy for per-PR gating, and the job pushes its
    # history to gh-pages (created on first run), which fork PRs can't do.
    #
    # Honesty about the budget: a 150% alert threshold on hosted runners
    # catches step-change regressions (an accidental extra pass over memory,
    # a quadratic slip) — it will NOT catch a quiet 10% drift. Precise
    # comparisons still belong on pinned hardware with the full job
    # (benchmarks/README.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push benchmark history to the gh-pages branch
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run Argon2id benchmarks (short job, net10.0, JSON export)
        run: >
          dotnet run -c Release -f net10.0
          --project benchmarks/PostQuantum.Identity.Benchmarks --
          --filter '*Argon2idBenchmarks*' --job short --exporters json

      - name: Track results and alert on regression (>150% of baseline)
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Argon2id benchmarks
          tool: benchmarkdotnet
          output-file-path: BenchmarkDotNet.Artifacts/results/PostQuantum.Identity.Benchmarks.Argon2idBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: 150%
          fail-on-alert: true
          comment-on-alert: true
          summary-always: true

  pack-verify:
    # Make sure the package itself builds cleanly on every PR — catches metadata
    # regressions long before a release tag is pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install CycloneDX SBOM tool
        run: dotnet tool install --global CycloneDX

      - name: Pack (Release)
        run: dotnet pack src/PostQuantum.Identity/PostQuantum.Identity.csproj -c Release -o artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ github.sha }}
          path: artifacts/*.*nupkg
          if-no-files-found: error
          retention-days: 14
