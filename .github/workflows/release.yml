name: Release

# Publishes the NuGet package when a version tag (e.g. v0.1.0-preview.1) is pushed.
# Requires the NUGET_API_KEY secret on the 'nuget-publish' environment to push to
# nuget.org. Optional NUGET_SIGNING_CERT (+ NUGET_SIGNING_CERT_PASSWORD) on the
# same environment enables author code signing of the .nupkg before push.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write       # for GitHub OIDC-backed build provenance attestations
  attestations: write   # for the attest-build-provenance action

jobs:
  pack:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history for deterministic SourceLink

      - name: Set up .NET (8 + 9 + 10)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
          global-json-file: global.json

      - name: Check version is in sync across csproj/README/CHANGELOG
        run: bash scripts/check-version-sync.sh

      - name: Resolve and verify package version against tag
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          csproj_version=$(grep -oP '(?<=<Version>)[^<]+' src/PostQuantum.Identity/PostQuantum.Identity.csproj)
          if [ "$tag" != "$csproj_version" ]; then
            echo "::error::Tag version ($tag) does not match csproj <Version> ($csproj_version)."
            exit 1
          fi
          echo "package_version=$csproj_version" >> "$GITHUB_OUTPUT"

      - name: Install CycloneDX SBOM tool
        run: dotnet tool install --global CycloneDX

      - name: Build (Release)
        run: dotnet build -c Release

      - name: Test (Release)
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack src/PostQuantum.Identity/PostQuantum.Identity.csproj -c Release --no-build -o artifacts

      - name: Generate top-level CycloneDX SBOM (in addition to the per-nupkg one)
        run: |
          set -euo pipefail
          dotnet CycloneDX src/PostQuantum.Identity/PostQuantum.Identity.csproj \
              --framework net10.0 --output artifacts --filename bom.json --json
          echo "---- SBOM head ----"; head -c 1024 artifacts/bom.json; echo; echo "-------------------"

      - name: Compute SHA-256 of artifacts for transparency
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum *.nupkg *.snupkg bom.json | tee SHA256SUMS.txt)

      - name: Generate build-provenance attestation for the .nupkg files
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "artifacts/*.nupkg"

      - name: Generate build-provenance attestation for the SBOM
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "artifacts/bom.json"

      - name: Upload artifacts to the workflow run
        uses: actions/upload-artifact@v5
        with:
          name: nuget-packages
          path: |
            artifacts/*.*nupkg
            artifacts/bom.json
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: pack
    # Bind to a GitHub Environment so an approver can gate the actual push to
    # nuget.org. Configure the 'nuget-publish' environment in repo settings and
    # add NUGET_API_KEY there (not as a plain repo secret) to enforce review.
    environment: nuget-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      NUGET_SIGNING_CERT: ${{ secrets.NUGET_SIGNING_CERT }}
      NUGET_SIGNING_CERT_PASSWORD: ${{ secrets.NUGET_SIGNING_CERT_PASSWORD }}
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v5
        with:
          name: nuget-packages
          path: artifacts

      - name: Verify an API key is configured
        run: |
          if [ -z "${NUGET_API_KEY}" ]; then
            echo "::error::NUGET_API_KEY is not set on the 'nuget-publish' environment."
            exit 1
          fi

      # Optional: author code-sign the .nupkg when a code-signing cert is provided.
      # Absent the secret we log it and continue (repo-signing-only stance, see
      # KNOWN-GAPS.md). When present, the cert is materialised to a temp file, used
      # by `dotnet nuget sign`, then shredded.
      - name: Author code-sign package (if certificate available)
        run: |
          set -euo pipefail
          if [ -z "${NUGET_SIGNING_CERT}" ]; then
            echo "NUGET_SIGNING_CERT not set — package relies on nuget.org repository signing only."
            echo "See KNOWN-GAPS.md for the rationale and roadmap."
            exit 0
          fi
          cert_path=$(mktemp --suffix=.pfx)
          echo "$NUGET_SIGNING_CERT" | base64 -d > "$cert_path"
          chmod 600 "$cert_path"
          dotnet nuget sign artifacts/*.nupkg \
              --certificate-path "$cert_path" \
              --certificate-password "$NUGET_SIGNING_CERT_PASSWORD" \
              --timestamper "http://timestamp.digicert.com" \
              --overwrite
          shred -u "$cert_path" || rm -f "$cert_path"
          echo "::notice::Package author-signed."

      # NuGet.org also applies repository signing on push. Build-provenance
      # attestations (in the pack job) are an independent transparency signal —
      # verify with `gh attestation verify <file> --repo systemslibrarian/postquantum-identity`.
      # `dotnet nuget push` uploads each .nupkg's adjacent .snupkg automatically;
      # `--skip-duplicate` keeps re-runs idempotent.
      - name: Push to nuget.org
        env:
          PKG_VERSION: ${{ needs.pack.outputs.package_version }}
        run: >
          dotnet nuget push "artifacts/PostQuantum.Identity.${PKG_VERSION}.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
